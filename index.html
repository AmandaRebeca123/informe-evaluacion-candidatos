<style>
  /* Layout: two-column workbench — form on the left, report sheet on the right; stacks on phones */
  :root {
    --bg: #eef1f3; --surface: #ffffff; --sheet: #fdfdfc; --fg: #1b2530; --muted: #5d6b78;
    --line: #d5dce2; --accent: #1f5f73; --accent-soft: #dcebef; --ochre: #a8741a;
    --ok: #2e7d4f; --warn: #a8741a; --bad: #a83a32;
    --display: "IBM Plex Serif", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12181d; --surface: #1a2229; --sheet: #1e272f; --fg: #e3e9ee; --muted: #93a2ae;
    --line: #2f3b45; --accent: #6fb3c7; --accent-soft: #1d3640; --ochre: #d6a24a;
    --ok: #6cc28f; --warn: #d6a24a; --bad: #e07d74; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #12181d; --surface: #1a2229; --sheet: #1e272f; --fg: #e3e9ee; --muted: #93a2ae;
    --line: #2f3b45; --accent: #6fb3c7; --accent-soft: #1d3640; --ochre: #d6a24a;
    --ok: #6cc28f; --warn: #d6a24a; --bad: #e07d74; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
  h1, h2, h3 { text-wrap: balance; }
  .label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--fg); font: inherit; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  textarea.field { resize: vertical; min-height: 200px; line-height: 1.6; }
  button:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .tabnum { font-variant-numeric: tabular-nums; }
  .sheet { background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(20,40,50,.18); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none } }
</style>

const ORDEN_NIVELES = ["operativo", "medio", "alta"];
const plantillaDe = f => PLANTILLAS[f?.nivel] || PLANTILLAS.medio;
const nombresComp = P => P.competencias.map(c => c.nombre);

/* Ajusta competencias al cambiar de nivel (o al abrir datos antiguos). */
const EQUIVALENCIAS = { "Liderazgo": "Liderazgo táctico" };
function normalizarForm(form) {
  const nivel = PLANTILLAS[form.nivel] ? form.nivel : "medio";
  const P = PLANTILLAS[nivel], prev = form.competencias || {};
  const renombradas = Object.fromEntries(Object.entries(prev).map(([k, v]) => [EQUIVALENCIAS[k] || k, v]));
  return { ...form, nivel, pruebas: form.pruebas || [], competencias: Object.fromEntries(nombresComp(P).map(n => [n, renombradas[n] ?? P.esperado])) };
}

/* Indicadores derivados del perfil según la plantilla del nivel. */
function analisisPerfil(f) {
  const P = plantillaDe(f);
  const comps = P.competencias.map((c, i) => ({ ...c, i, v: f.competencias?.[c.nombre] ?? 3 }));
  const brechas = comps.filter(c => c.v < P.esperado).sort((a, b) => a.v - b.v || a.i - b.i);
  const fuertes = comps.filter(c => c.v >= Math.max(4, P.esperado)).sort((a, b) => b.v - a.v || a.i - b.i);
  const prom = comps.reduce((s, c) => s + c.v, 0) / comps.length;
  const idx = brechas.length === 0 ? 0 : Math.min(2, brechas.length - 1 + P.peso);
  return { P, comps, brechas, fuertes, prom, cumple: comps.length - brechas.length, total: comps.length, riesgo: NIVELES_RIESGO[idx], riesgoIdx: idx };
}

function contexto(f, a) {
  return {
    nom: f.nombre || "el/la candidato/a", pila: (f.nombre || "").split(" ")[0] || "El/la evaluado/a",
    cargo: f.cargo || "[cargo]", area: f.area ? ` en el área de ${f.area}` : "",
    fuertes: a.fuertes.map(c => c.nombre), brechas: a.brechas.map(c => c.nombre),
    cumple: a.cumple, total: a.total, prom: a.prom.toFixed(1), esperado: a.P.esperado,
  };
}

/* Plantilla local: redacta con las reglas y el tono del nivel. */
function generarLocal(f) {
  const a = analisisPerfil(f), P = a.P, R = P.redaccion, c = contexto(f, a);
  const frases = (f.notas || "").split(/(?<=[.;])\s+/).map(s => s.trim()).filter(s => s.length > 8);
  const limpio = s => s.replace(/\s+/g, " ").trim();
  return {
    nivel: P.clave, fuente: "plantilla",
    objetivo: R.objetivo(c),
    sintesis: frases.length ? `${R.sintesis} ${frases.slice(0, 8).join(" ")}` : "No se registraron notas de entrevista.",
    perfil: limpio(R.perfil(c)),
    fortalezas: a.fuertes.length ? a.fuertes.map(x => `${x.nombre} (${ESCALA[x.v]}): ${x.def}.`) : [R.sinFortalezas],
    areas: a.brechas.length ? a.brechas.map(x => `${x.nombre} (${x.v}/5; requerido ${P.esperado}/5): ${x.bajo}. ${R.prefijoAccion} ${x.accion}.`) : [R.sinBrechas],
    conclusion: limpio(R.conclusion[f.dictamen](c)),
  };
}

function fechaLarga(iso) {

const ESTADOS_V = { pendiente: "Pendiente", confirmada: "Debilidad confirmada", descartada: "Debilidad descartada" };

function planVerificacion(f) {
  const a = analisisPerfil(f), rot = f.rot || 0;
  const orden = [...a.comps].sort((x, y) => x.v - y.v || x.i - y.i), deb = a.brechas;
  const slots = deb.length >= 3 ? deb.slice(0, 3).map(x => [x, 0])
    : deb.length === 2 ? [[deb[0], 0], [deb[1], 0], [deb[0], 1]]
    : deb.length === 1 ? [[deb[0], 0], [deb[0], 1], [orden[1], 0]]
    : orden.slice(0, 3).map(x => [x, 0]);
  const base = slots.map(([x, k]) => { const idx = (k + rot) % 3, q = x.preguntas[idx];
    return { id: `${x.nombre}#${idx}`, competencia: x.nombre, puntaje: x.v, pregunta: q.p, busca: q.b, alerta: q.a }; });
  const firma = base.map(q => q.id).join("|");
  const ia = f.preguntasIA && f.preguntasIA.firma === firma ? f.preguntasIA.lista : null;
  const items = ia ? base.map((q, i) => ({ ...q, id: `${q.competencia}#ia${i}`, pregunta: ia[i]?.pregunta || q.pregunta, busca: ia[i]?.busca || q.busca, alerta: ia[i]?.alerta || q.alerta })) : base;
  return { critico: deb.length > 0, debiles: deb.map(x => x.nombre), items, firma, personalizado: !!ia, P: a.P };
}
function resumenVerificacion(f) {
  const { items } = planVerificacion(f), v = f.verificacion || {};
  const cuenta = { pendiente: 0, confirmada: 0, descartada: 0 };
  items.forEach(q => cuenta[v[q.id]?.estado || "pendiente"]++);
  return cuenta;
}

function Comparador({ guardados, setGuardados, actual, onCargar, onCerrar, exportar }) {
  const grupos = {};
  guardados.forEach(e => { const k = claveVacante(e.form); (grupos[k] ||= { cargo: e.form.cargo, P: plantillaDe(e.form), items: [] }).items.push(e); });
  const claves = Object.keys(grupos);
  const [vac, setVac] = useState(grupos[claveVacante(actual)] ? claveVacante(actual) : claves[0]);
  const [borrar, setBorrar] = useState(null);
  useEffect(() => { if (!grupos[vac] && claves.length) setVac(claves[0]); }, [guardados.length]);
  useEffect(() => { const h = e => e.key === "Escape" && onCerrar(); window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, []);
  const g = grupos[vac];
  const lista = g ? [...g.items].sort((a, b) => promedio(b.form.competencias) - promedio(a.form.competencias)) : [];
  const an = lista.map(e => analisisPerfil(e.form)), maxP = Math.max(...an.map(x => x.prom), 0);
  const mejor = k => Math.max(...lista.map(e => e.form.competencias[k] ?? 0));
  const actualizar = l => { setGuardados(l); escribirGuardados(l); };
  const titulo = g ? `${g.cargo} · ${g.P.nombre}` : "";
  const fila = (etiqueta, celdas, fuerte) => html`<tr className="border-b border-line">
    <th scope="row" className=${"sticky left-0 bg-surface text-left p-3 " + (fuerte ? "font-semibold" : "font-medium")}>${etiqueta}</th>${celdas}</tr>`;

  return html`<div className="fixed inset-0 z-40 flex items-start justify-center bg-black/40 overflow-y-auto"
      style=${{ paddingTop: "calc(24px + env(safe-area-inset-top, 0px))", paddingBottom: "calc(24px + env(safe-area-inset-bottom, 0px))", paddingLeft: "max(12px, env(safe-area-inset-left, 0px))", paddingRight: "max(12px, env(safe-area-inset-right, 0px))" }}
      onClick=${e => e.target === e.currentTarget && onCerrar()}>
    <div role="dialog" aria-modal="true" aria-labelledby="comp-titulo" className="bg-surface border border-line rounded-lg w-full max-w-[1200px] flex flex-col shadow-2xl min-w-0">
      <div className="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-b border-line">
        <div className="min-w-0">
          <p className="label text-accent">Candidatos guardados en este navegador</p>
          <h2 id="comp-titulo" className="font-display text-[22px] font-semibold">Comparativo por vacante</h2>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          ${claves.length > 0 && html`<label htmlFor="sel-vacante" className="sr-only">Vacante</label>
          <select id="sel-vacante" className="field !w-auto max-w-full" value=${vac} onChange=${e => setVac(e.target.value)}>
            ${claves.map(k => html`<option key=${k} value=${k}>${grupos[k].cargo} · ${grupos[k].P.nombre} (${grupos[k].items.length})</option>`)}
          </select>`}
          ${lista.length > 1 && html`<button type="button" className="px-4 py-2 rounded-md bg-accent text-sheet text-sm font-semibold hover:opacity-90"
            onClick=${() => exportar(docComparativo(titulo, g.P, lista), nombreArchivo("Comparativo", g.cargo))}>Exportar comparativo PDF</button>`}
          <button type="button" className="px-3 py-2 rounded-md border border-line text-sm" onClick=${onCerrar}>Cerrar</button>
        </div>
      </div>

      ${!claves.length && html`<div className="p-10 text-center flex flex-col items-center gap-3 text-muted">
        <p className="font-display text-lg text-fg">Aún no hay candidatos guardados</p>
        <p className="text-sm max-w-[52ch]">Completa la evaluación de un candidato y pulsa <b>Guardar candidato</b>. Los candidatos con el mismo cargo y nivel se agrupan en una vacante para compararlos.</p>
        <button type="button" className="mt-2 px-4 py-2 rounded-md border border-accent text-accent text-sm font-semibold" onClick=${() => actualizar([...guardados, ...ejemplosComparativo()])}>Cargar 3 candidatos de ejemplo</button>
      </div>`}

      ${g && html`<div className="p-5 flex flex-col gap-4 min-w-0">
        <p className="text-sm text-muted">Nivel <b className="text-fg">${g.P.nombre}</b> · estándar requerido <b className="text-fg tabnum">${g.P.esperado}/5</b> · la marca vertical de cada barra indica el nivel requerido.</p>
        ${lista.length === 1 && html`<p className="text-sm bg-accentsoft rounded-md px-3 py-2">Solo hay un candidato en esta vacante. Guarda otro con el mismo cargo y nivel para compararlos.</p>`}
        <div className="overflow-x-auto border border-line rounded-md">
          <table className="w-full text-sm border-collapse tabnum">
            <thead><tr className="border-b border-line align-top">
              <th className="sticky left-0 bg-surface text-left p-3 label min-w-[170px]">Competencia</th>
              ${lista.map((e, i) => html`<th key=${e.id} className="text-left p-3 min-w-[190px] font-normal">
                <div className="flex flex-col gap-1">
                  <span className="font-mono text-xs text-accent">#${i + 1}${e.ejemplo ? " · ejemplo" : ""}</span>
                  <span className="font-semibold text-fg leading-tight">${e.form.nombre}</span>
                  <span className="text-xs text-muted">${e.form.documento || "—"} · ${fechaLarga(e.form.fecha)}</span>
                  <div className="flex gap-3 mt-1 text-xs">
                    ${borrar === e.id
                      ? html`<button type="button" className="text-bad font-semibold underline" onClick=${() => { actualizar(guardados.filter(x => x.id !== e.id)); setBorrar(null); }}>Confirmar</button>
                             <button type="button" className="text-muted underline" onClick=${() => setBorrar(null)}>Cancelar</button>`
                      : html`<button type="button" className="text-accent underline" onClick=${() => onCargar(e)}>Abrir</button>
                             <button type="button" className="text-muted underline" onClick=${() => setBorrar(e.id)}>Eliminar</button>`}
                  </div>
                </div>
              </th>`)}
            </tr></thead>
            <tbody>
              ${nombresComp(g.P).map(k => fila(k, lista.map(e => { const v = e.form.competencias[k] ?? 0, best = lista.length > 1 && v === mejor(k);
                return html`<td key=${e.id} className=${"p-3 " + (best ? "bg-accentsoft" : "")}>
                  <div className="flex items-center gap-3">
                    <span className=${"w-4 " + (v < g.P.esperado ? "text-bad font-semibold" : best ? "font-bold text-accent" : "")}>${v}</span>
                    <span className="flex-1"><${Barra} v=${v} esperado=${g.P.esperado} /></span>
                  </div></td>`; })))}
              ${fila("Promedio", an.map((x, i) => html`<td key=${lista[i].id} className=${"p-3 text-lg font-semibold " + (x.prom === maxP && lista.length > 1 ? "text-accent" : "")}>${x.prom.toFixed(2)}</td>`), true)}
              ${fila("Ajuste al perfil", an.map((x, i) => html`<td key=${lista[i].id} className="p-3">${x.cumple} de ${x.total}</td>`))}
              ${fila("Riesgo estimado", an.map((x, i) => html`<td key=${lista[i].id} className="p-3"><span className=${"inline-block border rounded px-2 py-0.5 text-xs font-semibold " + CLASE_RIESGO[x.riesgoIdx]}>${x.riesgo}</span></td>`))}
              ${fila("Contra-verificación", lista.map(e => { const c = resumenVerificacion(e.form); return html`<td key=${e.id} className="p-3 text-xs">
                <span className="text-bad font-semibold">${pl(c.confirmada, "confirmada", "confirmadas")}</span> · <span className="text-ok">${pl(c.descartada, "descartada", "descartadas")}</span> · <span className="text-muted">${pl(c.pendiente, "pendiente", "pendientes")}</span></td>`; }))}
              ${fila("Dictamen", lista.map(e => html`<td key=${e.id} className="p-3"><span className=${"inline-block border rounded px-2 py-0.5 text-xs font-semibold " + CLASE_DICT[e.form.dictamen]}>${e.form.dictamen}</span></td>`), true)}
            </tbody>
          </table>
        </div>
        <p className="text-xs text-muted">Ordenados por promedio. Las celdas resaltadas marcan el puntaje más alto de cada competencia. Los datos se guardan solo en este navegador.</p>
      </div>`}
    </div>
  </div>`;
}

function Verificacion({ f, setF, ia, notificar, exportar }) {
  const plan = planVerificacion(f), P = plan.P, v = f.verificacion || {};
  const [cargando, setCargando] = useState(false);
  const ctl = useRef(null);
  const marcar = (id, cambios) => setF(x => ({ ...x, verificacion: { ...(x.verificacion || {}), [id]: { ...((x.verificacion || {})[id] || {}), ...cambios } } }));
  const cuenta = resumenVerificacion(f);

  async function personalizar() {
    ctl.current = new AbortController(); setCargando(true);
    try {
      const res = await ia.json(promptPreguntas(f, plan), { signal: ctl.current.signal, modelTier: "default" });
      const lista = (Array.isArray(res) ? res : res?.preguntas || []).slice(0, 3).map(o => ({ pregunta: String(o?.pregunta || ""), busca: String(o?.busca || ""), alerta: String(o?.alerta || "") }));
      if (!lista.length) throw { code: "vacio" };
      setF(x => ({ ...x, preguntasIA: { firma: plan.firma, lista } }));
      notificar("Preguntas adaptadas a las notas de la entrevista.");
    } catch (e) { if (e?.code !== "cancelled") notificar("No se pudieron personalizar las preguntas; se mantienen las del banco.", "warn"); }
    setCargando(false);
  }
  async function copiar() {
    try { await navigator.clipboard.writeText(guiaTexto(f, plan)); notificar("Preguntas copiadas al portapapeles."); }
    catch { notificar("El navegador no permitió copiar. Usa Exportar guía PDF.", "warn"); }
  }
  const aviso = cuenta.confirmada > 0 && f.dictamen === "Recomendado"
    ? { t: `Se confirmó ${cuenta.confirmada === 1 ? "una debilidad" : cuenta.confirmada + " debilidades"} y el dictamen está en «Recomendado». Revisa si corresponde «Recomendado con observaciones».`, c: "border-warn text-warn" }
    : cuenta.pendiente === 0 && cuenta.confirmada === 0 && f.dictamen !== "Recomendado"
    ? { t: "Ninguna debilidad se confirmó. Valora si el dictamen puede mejorar.", c: "border-ok text-ok" }
    : cuenta.confirmada >= (P.clave === "alta" ? 1 : 2) && f.dictamen !== "No recomendado"
    ? { t: P.clave === "alta" ? "Hay debilidades confirmadas en un cargo directivo. Documenta el riesgo en la conclusión y considera una evaluación 360° o referencias ejecutivas." : "Dos o más debilidades confirmadas. Considera documentar el riesgo en la conclusión del informe.", c: "border-bad text-bad" } : null;

  return html`<div className="sheet rounded-sm px-5 sm:px-8 py-6 flex flex-col gap-5 lg:max-h-[calc(100vh-110px)] lg:overflow-y-auto">
    <header className="flex flex-col gap-2 border-b-2 border-accent pb-4">
      <span className="label">Uso interno del reclutador · ${P.nombre}</span>
      <h2 className="font-display text-[22px] leading-tight font-semibold">Preguntas de contra-verificación</h2>
      <p className="text-sm text-muted">${plan.critico
        ? html`Generadas a partir de las competencias por debajo del estándar del nivel (${P.esperado}/5): <b className="text-fg">${plan.debiles.join(", ")}</b>. Se actualizan al mover las valoraciones.`
        : `No hay competencias por debajo del estándar del nivel (${P.esperado}/5); se verifican las de menor puntaje.`}</p>
      <div className="flex flex-wrap gap-2 text-xs tabnum">
        <span className="px-2 py-0.5 rounded border border-line">${pl(cuenta.pendiente, "pendiente", "pendientes")}</span>
        <span className="px-2 py-0.5 rounded border border-bad text-bad">${pl(cuenta.confirmada, "confirmada", "confirmadas")}</span>
        <span className="px-2 py-0.5 rounded border border-ok text-ok">${pl(cuenta.descartada, "descartada", "descartadas")}</span>
        ${plan.personalizado && html`<span className="px-2 py-0.5 rounded bg-accentsoft text-accent font-semibold">Adaptadas por Claude</span>`}
      </div>
    </header>

    ${aviso && html`<p className=${"border-l-4 pl-3 py-1 text-sm font-medium " + aviso.c}>${aviso.t}</p>`}

    <ol className="flex flex-col gap-5">
      ${plan.items.map((q, i) => { const est = v[q.id]?.estado || "pendiente";
        return html`<li key=${q.id} className="flex flex-col gap-2 border border-line rounded-md p-4 bg-surface">
          <div className="flex flex-wrap items-baseline justify-between gap-2">
            <span className="flex items-baseline gap-2"><span className="font-mono text-xs text-accent">${String(i + 1).padStart(2, "0")}</span>
              <span className="label">${q.competencia}</span></span>
            <span className=${"text-xs tabnum font-semibold " + (q.puntaje < P.esperado ? "text-bad" : "text-warn")}>${q.puntaje}/5 · requerido ${P.esperado}</span>
          </div>
          <p className="font-display text-[16px] leading-snug">${q.pregunta}</p>
          <dl className="grid sm:grid-cols-2 gap-2 text-sm">
            <div className="min-w-0"><dt className="label text-ok">Respuesta favorable</dt><dd>${q.busca}</dd></div>
            <div className="min-w-0"><dt className="label text-bad">Señal de alerta</dt><dd>${q.alerta}</dd></div>
          </dl>
          <div className="flex flex-wrap gap-2 pt-1" role="radiogroup" aria-label=${"Resultado de la pregunta " + (i + 1)}>
            ${Object.entries(ESTADOS_V).map(([k, t]) => html`<button type="button" key=${k} role="radio" aria-checked=${est === k}
              className=${"px-3 py-1 rounded-md border text-xs " + (est === k ? (k === "confirmada" ? "border-bad text-bad font-semibold" : k === "descartada" ? "border-ok text-ok font-semibold" : "border-accent text-accent font-semibold") : "border-line text-muted")}
              onClick=${() => marcar(q.id, { estado: k })}>${t}</button>`)}
          </div>
          <label htmlFor=${"nota-" + i} className="sr-only">Notas de la respuesta ${i + 1}</label>
          <textarea id=${"nota-" + i} className="field text-sm !min-h-[64px]" placeholder="Anota lo que respondió el candidato…" value=${v[q.id]?.nota || ""} onChange=${e => marcar(q.id, { nota: e.target.value })}></textarea>
        </li>`; })}
    </ol>

    <div className="flex flex-wrap gap-2 border-t border-line pt-4">
      <button type="button" className="px-4 py-2 rounded-md bg-accent text-sheet text-sm font-semibold hover:opacity-90" onClick=${() => exportar(docGuia(f, plan), nombreArchivo("Contraverificacion", f.nombre))}>Exportar guía PDF</button>
      <button type="button" className="px-4 py-2 rounded-md border border-line bg-surface text-sm font-medium hover:border-accent" onClick=${copiar}>Copiar preguntas</button>
      <button type="button" className="px-4 py-2 rounded-md border border-line bg-surface text-sm font-medium hover:border-accent" onClick=${() => setF(x => ({ ...x, rot: ((x.rot || 0) + 1) % 3 }))}>Otras preguntas</button>
      ${ia && (cargando
        ? html`<button type="button" className="px-4 py-2 rounded-md border border-line text-sm" onClick=${() => ctl.current?.abort()}>Adaptando… Detener</button>`
        : html`<button type="button" className="px-4 py-2 rounded-md border border-accent text-accent text-sm font-semibold" onClick=${personalizar}>Adaptar a las notas con Claude</button>`)}
    </div>
  </div>`;
}

function VistaInforme({ f, r, estado, onRegenerar }) {
  if (estado === "generando") return html`<div className="flex flex-col gap-4 animate-pulse" aria-label="Generando informe">
    ${[70, 40, 95, 88, 92, 60, 85, 75].map((w, i) => html`<div key=${i} className="h-3 rounded bg-line" style=${{ width: w + "%" }}></div>`)}
  </div>`;
  if (!r) return html`<div className="m-auto text-center flex flex-col gap-2 max-w-[38ch] text-muted">
    <svg className="mx-auto" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
    <p className="font-display text-lg text-fg">El informe aparecerá aquí</p>
    <p className="text-sm">Elige el nivel del puesto, revisa los datos y pulsa <b>Generar informe</b>.</p>
  </div>`;
  const a = analisisPerfil(f), P = a.P, T = P.titulos, desfasado = r.nivel && r.nivel !== P.clave;
  return html`<${React.Fragment}>
    ${desfasado && html`<div className="flex flex-wrap items-center justify-between gap-2 border border-warn text-warn rounded-md px-3 py-2 text-sm">

      <button type="button" className="font-semibold underline" onClick=${onRegenerar}>Regenerar</button>
    </div>`}
    <header className="flex flex-col gap-1 border-b-2 border-accent pb-4">
      <div className="flex items-start justify-between gap-4">
        <div className="flex flex-col gap-1 min-w-0">
          <span className="label">Documento confidencial · ${fechaLarga(f.fecha)}</span>
          <h2 className="font-display text-[24px] leading-tight font-semibold">Informe de Evaluación Psicolaboral</h2>
        </div>
        <img src=${LOGO} alt="Corporación Bel" className="w-[96px] sm:w-[120px] h-auto shrink-0" />
      </div>
      <div className="flex flex-wrap items-center gap-2 text-xs text-muted">
        <span className="px-2 py-0.5 rounded bg-accentsoft text-accent font-semibold">${P.codigo} · ${P.nombre}</span>
        <span>Redacción ${P.registro.toLowerCase()} · ${r.fuente === "Claude" ? "redactado con Claude" : "plantilla local"}</span>
      </div>
    </header>
    <section className="flex flex-col gap-3">
      <dl className="grid grid-cols-[120px_minmax(0,1fr)] gap-x-4 gap-y-1 text-sm">
        ${datosIdentificacion(f).map(([k, v]) => html`<${React.Fragment} key=${k}><dt className="text-muted">${k}</dt><dd className="min-w-0 break-words">${v}</dd></${React.Fragment}>`)}
      </dl>
      <dl className="grid grid-cols-2 sm:grid-cols-4 border border-line rounded-md divide-x divide-line text-sm">
        ${[["Estándar requerido", `${P.esperado}/5`], ["Ajuste al perfil", `${a.cumple} de ${a.total}`], ["Alcance del impacto", P.alcance]].map(([k, v]) => html`<div key=${k} className="p-2.5 min-w-0"><dt className="label">${k}</dt><dd className="font-semibold">${v}</dd></div>`)}
        <div className="p-2.5 min-w-0"><dt className="label">Riesgo estimado</dt><dd><span className=${"inline-block border rounded px-2 text-xs font-semibold " + CLASE_RIESGO[a.riesgoIdx]}>${a.riesgo}</span></dd></div>
      </dl>
    </section>
    <${Seccion} n=${1} titulo="Objetivo de la evaluación"><p>${r.objetivo}</p></${Seccion}>
    <${Seccion} n=${2} titulo="Instrumentos aplicados">
      <ul className="flex flex-wrap gap-2">${f.pruebas.map(p => html`<li key=${p} className="text-sm px-2 py-0.5 rounded border border-line">${p}</li>`)}</ul>
    </${Seccion}>
    <${Seccion} n=${3} titulo="Síntesis de la entrevista"><p>${r.sintesis}</p></${Seccion}>
    <${Seccion} n=${4} titulo=${T.perfil}>
      <div className="flex flex-col gap-2.5">
        ${a.comps.map(x => html`<div key=${x.nombre} className="grid grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)_auto] items-center gap-3 text-sm">
          <span className="min-w-0">${x.nombre}</span>
          <${Barra} v=${x.v} esperado=${P.esperado} />

        <p className="text-xs text-muted">La marca vertical indica el nivel requerido para ${P.nombre.toLowerCase()} (${P.esperado}/5).</p>

    <${Seccion} n=${5} titulo=${T.fortalezas}><ul className="list-disc pl-5 flex flex-col gap-1 marker:text-accent">${r.fortalezas.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></${Seccion}>
    <${Seccion} n=${6} titulo=${T.areas}><ul className="list-disc pl-5 flex flex-col gap-1 marker:text-ochre">${r.areas.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul></${Seccion}>

      <div className="w-56 border-t border-muted pt-1">${f.evaluador || "Evaluador/a"}</div>
    </footer>
  </${React.Fragment}>`;
}

function App() {
  const [f, setF] = useState(EJEMPLO);
  const [r, setR] = useState(null);
  const [estado, setEstado] = useState("idle");
  const [modo, setModo] = useState("plantilla");
  const [aviso, setAviso] = useState(null);
  const [ia, setIa] = useState(null);
  const [dl, setDl] = useState(null);
  const [guardados, setGuardados] = useState(leerGuardados);
  const [comparar, setComparar] = useState(false);
  const [vista, setVista] = useState("informe");
  const ctl = useRef(null), textoRef = useRef(null), timer = useRef(null);
  const P = plantillaDe(f);
  const nVerif = resumenVerificacion(f).pendiente;
  const esEjemplo = f.nombre === EJEMPLO.nombre && f.notas === EJEMPLO.notas;

  useEffect(() => {
    let vivo = true;
    (async () => {
      const [s, d] = await Promise.all([window.claude?.use?.("sample") ?? null, window.claude?.use?.("downloads") ?? null]);
      if (!vivo) return; setIa(s); setDl(d); if (s) setModo("ia");
    })();
    return () => { vivo = false; };
  }, []);

  const set = k => v => setF(p => ({ ...p, [k]: v }));
  const notificar = (msg, tipo = "ok") => { clearTimeout(timer.current); setAviso({ msg, tipo }); timer.current = setTimeout(() => setAviso(null), 3400); };
  const cambiarNivel = nivel => { if (nivel === f.nivel) return; setF(x => normalizarForm({ ...x, nivel })); notificar(`Plantilla ${PLANTILLAS[nivel].nombre}: competencias y redacción actualizadas.`); };

  async function generar() {
    if (!f.nombre.trim() || !f.cargo.trim() || f.notas.trim().length < 30) {
      notificar("Completa nombre, cargo y al menos unas líneas de notas de entrevista.", "bad"); return;
    }
    setEstado("generando"); setR(null); setVista("informe");
    const base = generarLocal(f);
    if (modo === "ia" && ia) {
      ctl.current = new AbortController();
      try {
        const res = await ia.json(promptIA(f), { signal: ctl.current.signal, modelTier: "default" });
        const lista = x => Array.isArray(x) && x.length ? x.map(String) : null;
        setR({ ...base, fuente: "Claude", objetivo: res.objetivo || base.objetivo, sintesis: res.sintesis || base.sintesis, perfil: res.perfil || base.perfil,
          fortalezas: lista(res.fortalezas) || base.fortalezas, areas: lista(res.areas) || base.areas, conclusion: res.conclusion || base.conclusion });
      } catch (e) {
        if (e?.code === "cancelled") { setEstado("idle"); return; }
        if (e?.code === "not_granted") setIa(null);
        setR(base); notificar("No se pudo redactar con Claude; se generó con la plantilla local.", "warn");
      }
    } else {
      await new Promise(res => setTimeout(res, 700));
      setR(base);
    }
    setEstado("idle");
  }

  async function copiar() {
    const t = informeTexto(f, r);
    try { await navigator.clipboard.writeText(t); notificar("Informe copiado al portapapeles."); }
    catch { const el = textoRef.current; el.hidden = false; el.value = t; el.focus(); el.select(); notificar("Texto seleccionado: pulsa Ctrl+C (⌘+C) para copiarlo.", "warn"); }
  }

  async function exportar(dd, nombre) {
    const pdf = pdfMake.createPdf(dd);
    if (!dl) { pdf.download(nombre); notificar("PDF descargado."); return; }
    try { const blob = await new Promise(res => pdf.getBlob(res)); await dl.save({ filename: nombre, data: blob }); notificar("PDF listo."); }
    catch (e) { if (e?.code !== "declined") notificar(e?.code === "rate_limited" ? "Ya hay una descarga pendiente de confirmar." : "No se pudo generar el PDF.", "bad"); }
  }

  function guardar() {
    if (!f.nombre.trim() || !f.cargo.trim()) { notificar("Indica al menos el nombre y el cargo para guardar al candidato.", "bad"); return; }
    const vk = claveVacante(f), nk = f.nombre.trim().toLowerCase();
    const i = guardados.findIndex(e => claveVacante(e.form) === vk && e.form.nombre.trim().toLowerCase() === nk && (e.form.documento || "") === (f.documento || ""));
    const entrada = { id: i >= 0 ? guardados[i].id : nuevoId(), guardado: new Date().toISOString(), form: f, report: r };
    const l = i >= 0 ? guardados.map((e, j) => j === i ? entrada : e) : [...guardados, entrada];
    setGuardados(l);
    const n = l.filter(e => claveVacante(e.form) === vk).length;
    if (!escribirGuardados(l)) notificar("El navegador no permite guardar datos; el candidato se mantendrá solo mientras la página esté abierta.", "warn");
    else notificar(`${i >= 0 ? "Candidato actualizado" : "Candidato guardado"} · ${n} en ${f.cargo} (${P.nombre}).`);
  }
  function cargar(e) { setF(normalizarForm(e.form)); setR(e.report || null); setComparar(false); notificar(`Evaluación de ${e.form.nombre} abierta.`); }

  return html`<div className="wrap max-w-[1320px] mx-auto">
    <header className="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div>
        <p className="label text-accent">Gestión del Talento Humano</p>
        <h1 className="font-display text-[28px] leading-tight font-semibold">Generador de informes psicolaborales</h1>
        <p className="text-muted text-sm mt-1 max-w-[62ch]">Elige el nivel del puesto, registra la entrevista y valora las competencias. El informe adapta su profundidad, vocabulario y recomendaciones a la criticidad del cargo.</p>
      </div>
      <div className="flex flex-wrap gap-2">
        <button type="button" onClick=${guardar} className="px-4 py-2 rounded-md border border-line bg-surface text-sm font-medium hover:border-accent">Guardar candidato</button>
        <button type="button" onClick=${() => setComparar(true)} className="inline-flex items-center gap-2 px-4 py-2 rounded-md border border-accent text-accent bg-surface text-sm font-semibold hover:bg-accentsoft">
          Comparar candidatos
          <span className="tabnum text-xs bg-accent text-sheet rounded-full px-2 py-0.5">${guardados.length}</span>
        </button>
      </div>
    </header>

    <div className="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)] items-start">
      <form className="bg-surface border border-line rounded-lg p-5 flex flex-col gap-6 min-w-0" onSubmit=${e => { e.preventDefault(); generar(); }}>
        ${esEjemplo && html`<div className="flex flex-wrap items-center justify-between gap-2 bg-accentsoft rounded-md px-3 py-2 text-sm">
          <span>Datos de ejemplo cargados para mostrar el resultado.</span>
          <button type="button" className="font-semibold text-accent underline underline-offset-2" onClick=${() => { setF(enBlanco(f.nivel)); setR(null); }}>Empezar en blanco</button>
        </div>`}

        <${SelectorNivel} valor=${P.clave} onChange=${cambiarNivel} />

        <fieldset className="flex flex-col gap-3">
          <legend className="font-display text-lg font-semibold mb-2">Datos del candidato</legend>
          <div className="grid gap-3 sm:grid-cols-2">
            <${Campo} id="nombre" label="Nombre completo" value=${f.nombre} onChange=${set("nombre")} />
            <${Campo} id="documento" label="Documento de identidad" value=${f.documento} onChange=${set("documento")} placeholder="V-00.000.000" />
            <${Campo} id="cargo" label="Cargo al que aplica" value=${f.cargo} onChange=${set("cargo")} />
            <${Campo} id="area" label="Área / Departamento" value=${f.area} onChange=${set("area")} />
            <${Campo} id="edad" label="Edad" type="number" value=${f.edad} onChange=${set("edad")} />
            <${Campo} id="fecha" label="Fecha de evaluación" type="date" value=${f.fecha} onChange=${set("fecha")} />
            <${Campo} id="motivo" label="Motivo de la evaluación" value=${f.motivo} onChange=${set("motivo")} placeholder="Selección, promoción, desarrollo…" />
            <${Campo} id="evaluador" label="Evaluador/a" value=${f.evaluador} onChange=${set("evaluador")} />
          </div>
        </fieldset>

        <fieldset className="flex flex-col gap-2">
          <legend className="font-display text-lg font-semibold mb-2">Instrumentos aplicados</legend>
          <div className="flex flex-wrap gap-2">
            ${PRUEBAS.map(p => { const on = f.pruebas.includes(p);
              return html`<button type="button" key=${p} aria-pressed=${on}
                className=${"px-3 py-1.5 rounded-full text-sm border transition-colors " + (on ? "bg-accent text-sheet border-accent" : "border-line text-fg hover:border-accent")}
                onClick=${() => setF(x => ({ ...x, pruebas: on ? x.pruebas.filter(q => q !== p) : [...x.pruebas, p] }))}>${p}</button>`; })}
          </div>
        </fieldset>

        <fieldset className="flex flex-col gap-2">
          <legend className="font-display text-lg font-semibold mb-1">Notas de la entrevista</legend>
          <p className="text-muted text-sm">Escribe lo observado: conducta, ejemplos relatados, motivación, resultados de pruebas.</p>
          <textarea id="notas" className="field" value=${f.notas} onChange=${e => set("notas")(e.target.value)} placeholder="Ej.: Llega puntual, discurso fluido, relata experiencia en…"></textarea>
          <span className="text-xs text-muted self-end tabnum">${f.notas.trim() ? f.notas.trim().split(/\s+/).length : 0} palabras</span>
        </fieldset>

        <fieldset className="flex flex-col gap-3">
          <legend className="font-display text-lg font-semibold mb-1">Competencias del nivel <span className="text-muted text-sm font-normal">· ${P.nombre} · requerido ${P.esperado}/5</span></legend>
          ${P.competencias.map(c => {
            const v = f.competencias[c.nombre] ?? 3, id = "c-" + c.nombre.normalize("NFD").replace(/[^\w]+/g, "-"), brecha = v < P.esperado;
            return html`<div key=${c.nombre} className="grid grid-cols-[minmax(0,1fr)_auto] sm:grid-cols-[200px_minmax(0,1fr)_130px] items-center gap-x-3 gap-y-1">
              <label htmlFor=${id} className="text-sm font-medium flex flex-col min-w-0"><span>${c.nombre}</span><span className="text-xs text-muted font-normal leading-snug">${c.def.charAt(0).toUpperCase() + c.def.slice(1)}</span></label>
              <span className=${"text-xs tabnum sm:order-3 text-right " + (brecha ? "text-bad font-semibold" : "text-muted")}>${v} · ${brecha ? "Bajo lo requerido" : ESCALA[v]}</span>
              <input id=${id} type="range" min="1" max="5" step="1" value=${v} className="col-span-2 sm:col-span-1 w-full"
                onChange=${e => setF(x => ({ ...x, competencias: { ...x.competencias, [c.nombre]: +e.target.value } }))} />
            </div>`;
          })}
        </fieldset>

        <fieldset className="flex flex-col gap-2">
          <legend className="font-display text-lg font-semibold mb-2">Dictamen del evaluador</legend>
          <div className="flex flex-wrap gap-2">
            ${DICTAMENES.map(d => html`<label key=${d} className=${"flex items-center gap-2 px-3 py-2 rounded-md border text-sm cursor-pointer " + (f.dictamen === d ? CLASE_DICT[d] + " font-semibold" : "border-line")}>
              <input type="radio" name="dictamen" id=${"d-" + d.replace(/\s+/g, "-")} className="accent-[var(--accent)]" checked=${f.dictamen === d} onChange=${() => set("dictamen")(d)} />${d}
            </label>`)}
          </div>
        </fieldset>

        <div className="flex flex-col gap-3 border-t border-line pt-4">
          ${ia && html`<div className="flex flex-wrap items-center gap-2 text-sm" role="radiogroup" aria-label="Modo de redacción">
            <span className="label mr-1">Redacción</span>
            ${[["ia", "Con Claude (IA)"], ["plantilla", "Plantilla rápida"]].map(([k, t]) => html`<button type="button" key=${k} role="radio" aria-checked=${modo === k}
              className=${"px-3 py-1 rounded-md border " + (modo === k ? "border-accent text-accent font-semibold bg-accentsoft" : "border-line text-muted")} onClick=${() => setModo(k)}>${t}</button>`)}
          </div>`}
          <div className="flex flex-wrap gap-2">
            <button type="submit" disabled=${estado === "generando"} className="inline-flex items-center gap-2 bg-accent text-sheet font-semibold px-5 py-2.5 rounded-md hover:opacity-90 disabled:opacity-60">
              ${estado === "generando" && html`<svg className="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeOpacity=".3" strokeWidth="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="3"/></svg>`}
              ${estado === "generando" ? (modo === "ia" && ia ? "Redactando con Claude…" : "Generando…") : `Generar informe · ${P.nombre}`}
            </button>
            ${estado === "generando" && modo === "ia" && ia && html`<button type="button" className="px-4 py-2.5 rounded-md border border-line" onClick=${() => ctl.current?.abort()}>Detener</button>`}
          </div>
          ${modo === "ia" && ia && html`<p className="text-xs text-muted">La redacción con IA usa tu cuenta de Claude y puede tardar hasta un minuto. Revisa siempre el texto antes de firmarlo.</p>`}
        </div>
      </form>

      <div className="lg:sticky lg:top-4 flex flex-col gap-3 min-w-0">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <div className="flex gap-1 bg-surface border border-line rounded-md p-1" role="tablist" aria-label="Vista">
            ${[["informe", "Informe"], ["verificacion", "Contra-verificación"]].map(([k, t]) => html`<button type="button" key=${k} role="tab" aria-selected=${vista === k}
              className=${"px-3 py-1.5 rounded text-sm inline-flex items-center gap-2 " + (vista === k ? "bg-accent text-sheet font-semibold" : "text-muted hover:text-fg")} onClick=${() => setVista(k)}>
              ${t}${k === "verificacion" && nVerif > 0 && html`<span className=${"tabnum text-[11px] rounded-full px-1.5 " + (vista === k ? "bg-sheet text-accent" : "bg-warn text-sheet")}>${nVerif}</span>`}
            </button>`)}
          </div>
          ${vista === "informe" && r && estado !== "generando" && html`<div className="flex flex-wrap gap-2">
            <button type="button" onClick=${copiar} className="px-4 py-2 rounded-md border border-line bg-surface text-sm font-medium hover:border-accent">Copiar texto</button>
            ${html`<button type="button" onClick=${() => exportar(docInforme(f, r), nombreArchivo("Informe_psicolaboral", f.nombre))} className="px-4 py-2 rounded-md bg-accent text-sheet text-sm font-semibold hover:opacity-90">Descargar PDF</button>`}
          </div>`}
        </div>
        <textarea ref=${textoRef} id="texto-copia" hidden className="field text-xs font-mono" style=${{ minHeight: "120px" }} readOnly></textarea>

        ${vista === "verificacion" && html`<${Verificacion} f=${f} setF=${setF} ia=${ia} notificar=${notificar} exportar=${exportar} />`}
        <article hidden=${vista !== "informe"} className="sheet rounded-sm px-6 sm:px-10 py-8 flex flex-col gap-6 min-h-[560px] lg:max-h-[calc(100vh-110px)] lg:overflow-y-auto">
          <${VistaInforme} f=${f} r=${r} estado=${estado} onRegenerar=${generar} />
        </article>
      </div>
    </div>

    ${comparar && html`<${Comparador} guardados=${guardados} setGuardados=${setGuardados} actual=${f} onCargar=${cargar} onCerrar=${() => setComparar(false)} exportar=${exportar} />`}
    ${aviso && html`<div role="status" className=${"fixed z-50 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-md shadow-lg text-sm font-medium text-sheet max-w-[90vw] " + (aviso.tipo === "bad" ? "bg-bad" : aviso.tipo === "warn" ? "bg-warn" : "bg-ok")}
      style=${{ bottom: "calc(20px + env(safe-area-inset-bottom, 0px))" }}>${aviso.msg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>

</body>
</html>
